name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One run per ref: a newer push, or a duplicate trigger for the same one,
# cancels the older run
# (docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D11).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test ./...
      # The race detector needs cgo, which the Linux runner has
      # (0003-MADR D9; 0002-PLAN V3).
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: vet, gofmt, tidy, lint
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint" make lint
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      # Scripts, Markdown and workflows are checked as the pre-add gate and
      # the records require (0003-MADR D9).
      - name: shellcheck, markdownlint, actionlint
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shellcheck scripts/*.sh
          npx --yes markdownlint-cli2@0.23.2
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # The reusable release workflow's own tests
      # (docs/decisions/0002-MADR-rehome-selfupdate-from-mcplib.md §6).
      - name: verify self-update release fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-selfupdate-release_test.sh
      - name: Verify the release guard and its workflow contract
        shell: bash
        run: |
          ./scripts/refuse-existing-release_test.sh
          ./scripts/check-workflow-gh-repo.sh
          ./scripts/check-workflow-gh-repo_test.sh
          ./scripts/check-workflow-expressions.sh
          ./scripts/check-workflow-expressions.sh .github/workflows/ci.yml
          ./scripts/check-workflow-expressions_test.sh
